name: Public Stage-1 Browser Smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-preview:
    name: Public customer journey (read-only)
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Use Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Locate installed Chrome
        shell: bash
        run: |
          set -euo pipefail
          executable="$(command -v google-chrome || command -v chromium || true)"
          test -n "$executable"
          echo "BROWSER_EXECUTABLE=$executable" >> "$GITHUB_ENV"

      - name: Verify live send-free customer journey
        env:
          MEMORA_LIVE_ORIGIN: https://memoraevents.de/
        run: npm run smoke:live:stage1
